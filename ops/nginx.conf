# Example upstream for IT. Replace planning.example.internal with the real name and keep it in the
# app's public_origin, so the app's own origin check and this Host header agree.
server {
    listen 80;
    server_name planning.example.internal;
    server_tokens off;
    client_max_body_size 100m;  # matches the app's upload_max_mb default
    proxy_http_version 1.1;
    proxy_set_header Host $server_name;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 10s;
    proxy_read_timeout 70s;

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
    # Live edits: only this path upgrades, and only to a WebSocket (never h2c)
    location ~ ^/api/copies/[^/]+/ws$ {
        proxy_pass http://127.0.0.1:8000;
        # a location that sets any header drops the server-level ones, so they are repeated here
        proxy_set_header Host $server_name;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade websocket;
        proxy_set_header Connection upgrade;
    }
}
